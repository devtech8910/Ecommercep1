<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to your DevTech Fashion account. Access your luxury wardrobe, track orders, and experience personalized recommendations."
    />
    <meta name="author" content="DevTech Solutions" />
    <title>Sign In — DevTech Fashion</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <!-- EmailJS SDK for Client-Side Real-Time Emails -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
      (function(){
        emailjs.init({
          publicKey: "d65JAiVI2nOP-tSjB",
        });
      })();
    </script>
  </head>
  <body class="auth-page">
    <!-- Top-Left Back to Home Button -->
    <a href="../index.html" class="auth-back-home-btn" aria-label="Back to Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>Back to Home</span>
    </a>
    <!-- Noise overlay -->
    <div class="noise-overlay" aria-hidden="true"></div>

    <!-- Ambient light orbs -->
    <div class="ambient-container" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <!-- ========================================
         MAIN LOGIN SECTION
    ========================================= -->
    <main class="auth-main-container" style="padding-top: 80px !important;">
      <div class="auth-card-wrapper fade-in-up">
        <div class="auth-card glass-card">
          <!-- Card Header -->
          <div class="auth-card-header">
            <span class="auth-subtitle">DevTech Fashion</span>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-description">Sign in to your account with your credentials.</p>
          </div>

          <!-- Main Login Form -->
          <form class="auth-form" id="login-form" novalidate>
            <!-- Email Field -->
            <div class="form-group-input">
              <label for="email" class="form-label-input">Email Address</label>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                </span>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="glass-input-field"
                  placeholder="name@example.com"
                  autocomplete="email"
                  required
                  aria-required="true"
                />
              </div>
              <span class="field-error-message" id="email-error" role="alert"></span>
            </div>

            <!-- Password Field -->
            <div class="form-group-input">
              <div class="label-row">
                <label for="password" class="form-label-input">Password</label>
                <a href="#" class="forgot-link" id="forgot-password-link">Forgot Password?</a>
              </div>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="glass-input-field"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                  aria-required="true"
                />
                <button type="button" class="password-toggle-btn" id="password-toggle" aria-label="Show password">
                  <svg class="eye-icon eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                  <svg class="eye-icon eye-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" style="display:none;">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <span class="field-error-message" id="password-error" role="alert"></span>
            </div>

            <!-- Remember Me -->
            <div class="form-checkbox-row">
              <label class="custom-checkbox-container">
                <input type="checkbox" id="remember-me" name="remember" />
                <span class="custom-checkbox" aria-hidden="true"></span>
                <span class="checkbox-label">Keep me signed in</span>
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary btn-full ripple-btn" id="login-submit-btn">
              <span>Sign In</span>
            </button>
          </form>

          <!-- Card Footer -->
          <div class="auth-card-footer">
            <p>New to DevTech Fashion? <a href="signup.html" class="auth-redirect-link">Sign Up</a></p>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer auth-footer" role="contentinfo">
      <div class="container">
        <div class="footer-bottom-content">
          <p class="footer-copy">&copy; <span id="footer-year"></span> DevTech Solutions. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="../js/script.js"></script>
    <script src="../js/mobile-ui.js"></script>
    <script src="../js/login.js"></script>

    <!-- React Address Picker Dynamic Integration -->
    <script type="module">
      fetch('http://localhost:3000/src/main.tsx')
        .then(() => {
          const preamble = document.createElement('script');
          preamble.type = 'module';
          preamble.innerHTML = `
            import RefreshRuntime from 'http://localhost:3000/@react-refresh'
            RefreshRuntime.injectIntoGlobalHook(window)
            window.$RefreshReg$ = () => {}
            window.$RefreshSig$ = () => (type) => type
            window.__vite_plugin_react_preamble_installed__ = true
          `;
          document.head.appendChild(preamble);

          const client = document.createElement('script');
          client.type = 'module';
          client.src = 'http://localhost:3000/@vite/client';
          document.body.appendChild(client);

          const main = document.createElement('script');
          main.type = 'module';
          main.src = 'http://localhost:3000/src/main.tsx';
          document.body.appendChild(main);
        })
        .catch(() => {
          console.info('React Address Picker dev server not running.');
        });
    </script>
  </body>
</html>
