<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wishlist — DevTech Fashion</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/responsive.css" />

    <style>
      body {
        background-color: #0a0a14;
        color: #f0f0f5;
        font-family: 'Inter', sans-serif;
      }
      .wishlist-glass-card {
        background: rgba(18, 18, 34, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        backdrop-filter: blur(28px) saturate(180%);
        padding: 40px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.12);
      }
      .wishlist-card {
        background: rgba(255, 255, 255, 0.04);
        border: 1.5px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: all 0.25s ease;
      }
      .wishlist-card:hover {
        background: rgba(255, 255, 255, 0.07);
        border-color: rgba(99, 102, 241, 0.35);
        transform: translateY(-4px);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      }
      .btn-gradient-indigo {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #ffffff;
        border: none;
        border-radius: 12px;
        font-weight: 800;
        font-size: 13.5px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
      }
      .btn-gradient-indigo:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
      }
    </style>
  </head>
  <body class="auth-page">
    <!-- Noise overlay -->
    <div class="noise-overlay" aria-hidden="true"></div>

    <!-- Ambient light orbs -->
    <div class="ambient-container" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <!-- ========================================
         MAIN WISHLIST SECTION
    ========================================= -->
    <main class="auth-main-container" style="padding-top: 60px !important; padding-bottom: var(--space-12); max-width: 1050px; margin: 0 auto; width: 100%; box-sizing: border-box; padding: 0 20px;">
      
      <div class="auth-card-wrapper fade-in-up" style="max-width: 100%;">
        <div class="wishlist-glass-card">
          <!-- Header -->
          <div style="text-align: left; margin-bottom: 32px;">
            <span style="font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: #818cf8; display: block; margin-bottom: 4px;">Your Saved Items</span>
            <h1 style="font-family: var(--font-display); font-size: 32px; font-weight: 800; color: #ffffff; margin: 0 0 6px;">My Wishlist</h1>
            <p style="font-size: 14px; color: #94a3b8; margin: 0; line-height: 1.5;">Keep track of the premium products you love.</p>
          </div>

          <!-- Wishlist Grid -->
          <div id="wishlist-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; width: 100%;">
            <!-- Dynamic items go here -->
          </div>

          <!-- Empty State -->
          <div id="wishlist-empty" style="display: none; text-align: center; padding: 50px 20px;">
            <div style="font-size: 54px; margin-bottom: 16px;">💖</div>
            <h3 style="font-size: 22px; font-weight: 800; color: #ffffff; margin: 0 0 8px;">Your Wishlist is Empty</h3>
            <p style="font-size: 14px; color: #94a3b8; margin: 0 0 28px; line-height: 1.5;">You haven't saved any items yet. Explore our collections to find your style.</p>
            <a href="../index.html" class="btn-gradient-indigo" style="display: inline-flex; align-items: center; justify-content: center; padding: 14px 32px; text-decoration: none; border-radius: 99px;">Browse Products</a>
          </div>

        </div>
      </div>
    </main>

    <!-- Custom JavaScript -->
    <script src="../js/script.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        document.documentElement.setAttribute('data-theme', 'dark');

        const grid = document.getElementById('wishlist-grid');
        const emptyState = document.getElementById('wishlist-empty');

        function loadWishlist() {
          try {
            const raw = localStorage.getItem('dtf_wishlist');
            return JSON.parse(raw) || [];
          } catch {
            return [];
          }
        }

        function saveWishlist(items) {
          localStorage.setItem('dtf_wishlist', JSON.stringify(items));
          window.dispatchEvent(new Event('dtf:wishlist:updated'));
        }

        function loadCart() {
          try {
            const raw = localStorage.getItem('dtf_cart');
            return JSON.parse(raw) || [];
          } catch {
            return [];
          }
        }

        function saveCart(items) {
          localStorage.setItem('dtf_cart', JSON.stringify(items));
          window.dispatchEvent(new Event('dtf:cart:updated'));
        }

        function render() {
          const items = loadWishlist();
          grid.innerHTML = '';

          if (items.length === 0) {
            grid.style.display = 'none';
            emptyState.style.display = 'block';
            return;
          }

          grid.style.display = 'grid';
          emptyState.style.display = 'none';

          items.forEach((item, index) => {
            const card = document.createElement('article');
            card.className = 'wishlist-card';

            card.innerHTML = `
              <div style="height: 220px; overflow: hidden; background: #1e1e30; position: relative;">
                <img src="${item.image || 'https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?w=600&q=80&fit=crop'}" style="width: 100%; height: 100%; object-fit: cover;" alt="${item.title || 'Product'}" />
                <button class="remove-wishlist-btn" style="position: absolute; top: 12px; right: 12px; border: none; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #ef4444; font-size: 16px; transition: transform 0.2s;">
                  &times;
                </button>
              </div>
              <div style="padding: 18px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1;">
                <h4 style="margin: 0; font-size: 15px; font-weight: 700; color: #ffffff;">${item.title || 'Classic Product'}</h4>
                <p style="margin: 0; font-size: 15px; font-weight: 800; color: #818cf8;">₹${parseFloat(item.price || 0).toLocaleString('en-IN')}</p>
                <div style="margin-top: auto; padding-top: 10px;">
                  <button class="add-to-cart-btn btn-gradient-indigo" style="width: 100%; padding: 12px;">
                    🛒 Move to Cart
                  </button>
                </div>
              </div>
            `;

            // Remove from wishlist
            card.querySelector('.remove-wishlist-btn').addEventListener('click', () => {
              const updated = loadWishlist();
              updated.splice(index, 1);
              saveWishlist(updated);
              render();
            });

            // Move to cart
            card.querySelector('.add-to-cart-btn').addEventListener('click', () => {
              const cartItems = loadCart();
              const existingIndex = cartItems.findIndex(c => c.title === item.title);
              if (existingIndex > -1) {
                cartItems[existingIndex].quantity = (cartItems[existingIndex].quantity || 1) + 1;
              } else {
                cartItems.push({ ...item, quantity: 1 });
              }
              saveCart(cartItems);

              // Remove from wishlist
              const updatedWishlist = loadWishlist();
              updatedWishlist.splice(index, 1);
              saveWishlist(updatedWishlist);

              alert(`🛒 "${item.title || 'Product'}" moved to your Cart!`);
              render();
            });

            grid.appendChild(card);
          });
        }

        render();
        window.addEventListener('storage', render);
      });
    </script>
  </body>
</html>
