# Netlify Build Configuration for Fashion Company E-Commerce
[build]
  publish = "dist"
  command = "node scripts/build-storefront.cjs"
  functions = "netlify/functions"

# Map /api/* to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# This is a multi-page storefront. Unknown URLs must not masquerade as the homepage.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'"
