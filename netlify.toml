# Netlify Build Configuration for DevTech Fashion E-Commerce
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  external_node_modules = ["@netlify/blobs"]
  node_bundler = "esbuild"

# Netlify Serverless API Functions Redirect
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Serve static pages directly
[[redirects]]
  from = "/pages/*"
  to = "/pages/:splat"
  status = 200

# Single Page Navigation Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
