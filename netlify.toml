# Netlify Build Configuration for DevTech Fashion E-Commerce
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# Map /api/* to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Fallback for single page navigation (only triggers when static file is not found)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
